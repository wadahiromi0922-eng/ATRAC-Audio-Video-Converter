name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    paths:
      - "ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip"
      - ".github/workflows/build-macos-dmg.yml"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mac_source
          mkdir -p mac_source
          ditto -x -k ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip mac_source
          find mac_source -maxdepth 4 -type f -print | sort

      - name: Prepare Python 3.13 with Tk
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Intel macOS image can already contain framework Python
          # symlinks in /usr/local/bin. Homebrew's python@3.13 bottle may
          # therefore report a non-fatal brew-link conflict. The formula is
          # still installed, so do not abort on that link-only exit status.
          brew install python@3.13 python-tk@3.13 || true

          PY313_PREFIX="$(brew --prefix python@3.13)"
          PY313_BIN="$PY313_PREFIX/bin"
          PY313_LIBEXEC="$PY313_PREFIX/libexec/bin"

          test -x "$PY313_BIN/python3.13"
          echo "$PY313_LIBEXEC" >> "$GITHUB_PATH"
          echo "$PY313_BIN" >> "$GITHUB_PATH"
          export PATH="$PY313_LIBEXEC:$PY313_BIN:$PATH"

          echo "Python used by macOS builder:"
          "$PY313_BIN/python3.13" --version
          "$PY313_BIN/python3.13" -c 'import tkinter; print("Tkinter OK:", tkinter.TkVersion)'

      - name: Find and run DMG builder
        shell: bash
        run: |
          set -euo pipefail
          BUILDER="$(find "$GITHUB_WORKSPACE/mac_source" -type f -name BUILD_DMG.command -print -quit)"
          if [ -z "$BUILDER" ]; then
            echo "ERROR: BUILD_DMG.command was not found."
            exit 1
          fi

          ROOT="$(dirname "$BUILDER")"
          cd "$ROOT"
          chmod +x BUILD_DMG.command
          xattr -dr com.apple.quarantine . 2>/dev/null || true

          (
            for i in {1..900}; do
              SRC="$(find "$ROOT" -type f -path "*/_atracdenc_mac/CMakeLists.txt" -print -quit 2>/dev/null || true)"
              if [ -n "$SRC" ]; then
                echo "Patching atracdenc: $SRC"
                sed -i '' \
                  -e 's/set(CMAKE_OSX_ARCHITECTURES "arm64;x86_64")/set(CMAKE_OSX_ARCHITECTURES "x86_64")/g' \
                  -e 's/find_package(GTest)/set(GTest_FOUND FALSE)/g' \
                  -e 's/if (GTest_FOUND)/if (FALSE)/g' \
                  -e 's/add_subdirectory(test)/# add_subdirectory(test) disabled for packaging/g' \
                  "$SRC"
                echo "atracdenc patch applied"
                break
              fi
              sleep 0.1
            done
          ) &
          WATCHER=$!

          set +e
          ./BUILD_DMG.command
          BUILDER_EXIT=$?
          set -e

          wait "$WATCHER" || true
          exit "$BUILDER_EXIT"

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find "$GITHUB_WORKSPACE/mac_source" -type f -name "*.dmg" -print -quit)"
          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG file was generated."
            find "$GITHUB_WORKSPACE/mac_source" -maxdepth 8 -type f -print | sort
            exit 1
          fi
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATRAC-macOS-DMG
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 30
