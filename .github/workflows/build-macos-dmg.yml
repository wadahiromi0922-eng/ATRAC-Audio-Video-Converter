name: Build macOS DMG
# YAML syntax fix: keep the embedded Python heredoc inside the run block.

on:
  workflow_dispatch:
  push:
    paths:
      - "ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip"
      - ".github/workflows/build-macos-dmg.yml"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e
          test -f ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip

      - name: Extract source
        shell: bash
        run: |
          set -e
          rm -rf mac_source
          mkdir mac_source
          ditto -x -k ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip mac_source
          find mac_source -maxdepth 3 -type f | sort

      - name: Find and run DMG builder
        shell: bash
        run: |
          set -euo pipefail
          BUILDER="$(find "$GITHUB_WORKSPACE/mac_source" -type f -name BUILD_DMG.command -print -quit)"
          if [ -z "$BUILDER" ]; then
            echo "BUILD_DMG.command was not found."
            exit 1
          fi

          ROOT="$(dirname "$BUILDER")"
          cd "$ROOT"
          chmod +x BUILD_DMG.command
          xattr -dr com.apple.quarantine . 2>/dev/null || true

          # The builder clones atracdenc while running. Watch for its CMake
          # file and patch it before its configure step reaches the tests.
          (
            for i in {1..900}; do
              SRC="$(find "$ROOT" -type f -path "*/_atracdenc_mac/CMakeLists.txt" -print -quit 2>/dev/null || true)"
              if [ -n "$SRC" ]; then
                echo "Patching atracdenc: $SRC"
                python3 - "$SRC" <<'PY'
                import sys
                p = sys.argv[1]
                s = open(p, encoding="utf-8").read()
                s = s.replace('set(CMAKE_OSX_ARCHITECTURES "arm64;x86_64")', 'set(CMAKE_OSX_ARCHITECTURES "x86_64")')
                s = s.replace('find_package(GTest)', 'set(GTest_FOUND FALSE)')
                s = s.replace('if (GTest_FOUND)', 'if (FALSE)')
                s = s.replace('add_subdirectory(test)', '# add_subdirectory(test) disabled for packaging')
                open(p, "w", encoding="utf-8").write(s)
                print("atracdenc patch applied")
                PY
                break
              fi
              sleep 0.1
            done
          ) &
          WATCHER=$!

          ./BUILD_DMG.command
          BUILDER_EXIT=$?
          wait "$WATCHER" || true
          exit "$BUILDER_EXIT"

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          set -e
          DMG="$(find "$GITHUB_WORKSPACE/mac_source" -type f -name "*.dmg" -print -quit)"
          if [ -z "$DMG" ]; then
            echo "No DMG file was generated."
            find "$GITHUB_WORKSPACE/mac_source" -maxdepth 6 -type f | sort
            exit 1
          fi
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATRAC-macOS-DMG
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 30
