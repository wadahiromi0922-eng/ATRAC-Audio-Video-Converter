name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    paths:
      - "ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip"
      - ".github/workflows/build-macos-dmg.yml"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e
          test -f ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip || {
            echo "ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip is missing from the repository root."
            exit 1
          }

      - name: Extract source
        shell: bash
        run: |
          set -e
          rm -rf mac_source
          mkdir mac_source
          ditto -x -k ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip mac_source
          echo "Extracted files:"
          find mac_source -maxdepth 3 -type f | sort

      - name: Prepare atracdenc macOS compatibility
        shell: bash
        run: |
          set -e
          REAL_CMAKE="$(command -v cmake)"
          mkdir -p "$RUNNER_TEMP/atrac-tools"
          cat > "$RUNNER_TEMP/atrac-tools/cmake" <<'WRAPPER'
          #!/bin/bash
          set -e
          # atracdenc currently forces a universal macOS build while Homebrew's
          # GoogleTest is single-architecture. Before its configure step,
          # make atracdenc use the runner architecture and skip unit tests.
          SRC=""
          for p in "$PWD/.." "$PWD" "$PWD/../.." ; do
            if [ -f "$p/CMakeLists.txt" ] && grep -q 'project(atracdenc)' "$p/CMakeLists.txt" 2>/dev/null; then
              SRC="$p/CMakeLists.txt"
              break
            fi
          done
          if [ -n "$SRC" ]; then
            python3 - "$SRC" <<'PY'
          import sys
          p=sys.argv[1]
          s=open(p,encoding="utf-8").read()
          s=s.replace('find_package(GTest)', 'set(GTest_FOUND FALSE)')
          s=s.replace('set(CMAKE_OSX_ARCHITECTURES "arm64;x86_64")', 'set(CMAKE_OSX_ARCHITECTURES "x86_64")')
          open(p,"w",encoding="utf-8").write(s)
          PY
          fi
          exec "$REAL_CMAKE_BIN" "$@"
          WRAPPER
          chmod +x "$RUNNER_TEMP/atrac-tools/cmake"
          echo "REAL_CMAKE_BIN=$REAL_CMAKE" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/atrac-tools" >> "$GITHUB_PATH"

      - name: Find and run DMG builder
        shell: bash
        run: |
          set -euo pipefail
          BUILDER="$(find "$GITHUB_WORKSPACE/mac_source" -type f -name BUILD_DMG.command -print -quit)"
          if [ -z "$BUILDER" ]; then
            echo "BUILD_DMG.command was not found."
            exit 1
          fi
          ROOT="$(dirname "$BUILDER")"
          cd "$ROOT"
          chmod +x BUILD_DMG.command
          xattr -dr com.apple.quarantine . 2>/dev/null || true
          ./BUILD_DMG.command

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          set -e
          DMG="$(find "$GITHUB_WORKSPACE/mac_source" -type f -name "*.dmg" -print -quit)"
          if [ -z "$DMG" ]; then
            echo "No DMG file was generated."
            find "$GITHUB_WORKSPACE/mac_source" -maxdepth 5 -type f | sort
            exit 1
          fi
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATRAC-macOS-DMG
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 30
