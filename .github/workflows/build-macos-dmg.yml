name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    paths:
      - "ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip"
      - ".github/workflows/build-macos-dmg.yml"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mac_source
          mkdir -p mac_source
          ditto -x -k ATRAC_v32_36_MAC_DMG_BUILDER_SOURCE.zip mac_source
          find mac_source -maxdepth 4 -type f -print | sort

      - name: Prepare Python 3.13 with Tk
        shell: bash
        run: |
          set -euo pipefail
          brew install python@3.13 python-tk@3.13 || true
          brew link --overwrite python@3.13 || true
          PY313_PREFIX="$(brew --prefix python@3.13)"
          PY313="$PY313_PREFIX/bin/python3.13"
          test -x "$PY313"
          "$PY313" --version
          "$PY313" -c 'import tkinter; print("Tkinter OK:", tkinter.TkVersion)'
          echo "$PY313_PREFIX/libexec/bin" >> "$GITHUB_PATH"
          echo "$PY313_PREFIX/bin" >> "$GITHUB_PATH"
          echo "ATRAC_PYTHON=$PY313" >> "$GITHUB_ENV"

      - name: Find and run DMG builder
        shell: bash
        run: |
          set -euo pipefail
          BUILDER="$(find "$GITHUB_WORKSPACE/mac_source" -type f -name BUILD_DMG.command -print -quit)"
          if [ -z "$BUILDER" ]; then
            echo "ERROR: BUILD_DMG.command was not found."
            exit 1
          fi
          ROOT="$(dirname "$BUILDER")"
          cd "$ROOT"
          chmod +x BUILD_DMG.command
          xattr -dr com.apple.quarantine . 2>/dev/null || true

          PY313="${ATRAC_PYTHON}"
          SHIM="$RUNNER_TEMP/atrac-python-shim"
          mkdir -p "$SHIM"
          ln -sf "$PY313" "$SHIM/python3.14"
          ln -sf "$PY313" "$SHIM/python3.13"
          ln -sf "$PY313" "$SHIM/python3"
          ln -sf "$PY313" "$SHIM/python"
          export PATH="$SHIM:$PATH"

          # The bundled builder creates its own venv and was still selecting
          # the runner's Python 3.14. Force common interpreter paths as well as
          # explicit venv creation commands to Python 3.13 with Tk support.
          sudo ln -sf "$PY313" /usr/local/bin/python3.14
          sudo ln -sf "$PY313" /usr/local/bin/python3
          sudo ln -sf "$PY313" /usr/local/bin/python
          sudo ln -sf "$PY313" /usr/local/bin/python3.13

          while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'text'; then
              sed -i '' \
                -e "s|/usr/local/bin/python3.14|$PY313|g" \
                -e "s|/opt/homebrew/bin/python3.14|$PY313|g" \
                -e "s|python3.14|$PY313|g" \
                -e "s|python@3.14|python@3.13|g" \
                -e "s|python3 -m venv|$PY313 -m venv|g" \
                -e "s|python -m venv|$PY313 -m venv|g" \
                -e "s|python3 -m pip|$PY313 -m pip|g" \
                "$f" || true
            fi
          done < <(find "$ROOT" -type f -print0)

          echo "Python used by builder:"
          python3 --version
          python3 -c 'import tkinter; print("Tkinter OK:", tkinter.TkVersion)'

          (
            for i in {1..900}; do
              SRC="$(find "$ROOT" -type f -path "*/_atracdenc_mac/CMakeLists.txt" -print -quit 2>/dev/null || true)"
              if [ -n "$SRC" ]; then
                echo "Patching atracdenc: $SRC"
                sed -i '' \
                  -e 's/set(CMAKE_OSX_ARCHITECTURES "arm64;x86_64")/set(CMAKE_OSX_ARCHITECTURES "x86_64")/g' \
                  -e 's/find_package(GTest)/set(GTest_FOUND FALSE)/g' \
                  -e 's/if (GTest_FOUND)/if (FALSE)/g' \
                  -e 's/add_subdirectory(test)/# add_subdirectory(test) disabled for packaging/g' \
                  "$SRC"
                echo "atracdenc patch applied"
                break
              fi
              sleep 0.1
            done
          ) &
          WATCHER=$!

          set +e
          ./BUILD_DMG.command
          BUILDER_EXIT=$?
          set -e
          wait "$WATCHER" || true
          exit "$BUILDER_EXIT"

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find "$GITHUB_WORKSPACE/mac_source" -type f -name "*.dmg" -print -quit)"
          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG file was generated."
            find "$GITHUB_WORKSPACE/mac_source" -maxdepth 8 -type f -print | sort
            exit 1
          fi
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATRAC-macOS-DMG
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 30
